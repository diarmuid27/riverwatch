$('mapplot').innerHTML = `
<svg viewBox="0 0 360 320" role="img"
     aria-label="Geographical coverage of eight towns">

  <rect width="360" height="320" rx="12"
        fill="#0c202c"/>

  ${[50,100,150,200,250,300].map(v => `
    <path d="M20 ${v}H340 M${v} 20V300"
          stroke="#244553"
          stroke-dasharray="3 5"/>
  `).join('')}

  ${names.map((n,i) => {
    const t = ts.find(x => x.town === n);
    const x = 65 + (geo[i][1] + 9.1) * 90;
    const y = 30 + (54.1 - geo[i][0]) * 95;

    const offsets = {
      'Clonmel': [12, -10, 'start'],
      'Fermoy': [12, 15, 'start'],
      'Mallow': [-12, -12, 'end'],
      'Bandon': [12, 18, 'start'],
      'Enniscorthy': [-12, -10, 'end'],
      'Ennis': [12, -10, 'start'],
      'Athlone': [12, 4, 'start'],
      'Carrick-on-Shannon': [12, 4, 'start']
    };

    const [dx,dy,anchor] = offsets[n];

    const colour =
      ['#4ade80','#fbbf24','#fb7185'][t?.level]
      ?? '#a4b4c0';

    return `
      <line x1="${x}" y1="${y}"
            x2="${x+dx}" y2="${y+dy-3}"
            stroke="#7896a4"
            stroke-width="1"/>

      <circle cx="${x}" cy="${y}" r="6"
              fill="${colour}"/>

      <text x="${x+dx}" y="${y+dy}"
            text-anchor="${anchor}"
            font-size="10"
            font-weight="600"
            fill="#eef7fa">
        ${esc(n)}${areas[n]?' ⚑':''}
      </text>
    `;
  }).join('')}

</svg>`;
